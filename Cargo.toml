[package]
name = "chromarig"
version = "0.1.0"
edition = "2024"
description = "Turn every RGB light in a PC off and on again"
license = "GPL-2.0-only"
repository = "https://github.com/LeahyCC/ChromaRig"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.4"
toml = "1.2.1"
